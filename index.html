<script>

/* =========================
   SPRÜCHE
========================= */

const spruchDeutsch =
    "Ich stand abends gegen 23 Uhr alleine vorm Cinemaxx, als ein schwarzes Auto vor mir gehalten hat: „Hey, kennst du die Icki Micki Straße?“ Ich hab den Namen nicht ganz verstanden, wollte ihm helfen und bin einen Schritt näher ans Auto gegangen. Ich frage, welche Straße, und er sagt: „Ja, komm mit, die ist direkt neben der Ficki Ficki Straße.“";


const spruchEnglisch =
    "One evening, around 11 p.m., I was standing alone in front of the Cinemaxx when a black car stopped in front of me. The driver said: „Hey, do you know Icki Micki Street?“ I didn't quite understand the name and wanted to help him, so I took one step closer to the car. I asked which street, and he said: „Yeah, come with me. It's right next to Ficki Ficki Street.“";


/* =========================
   TEXT FÜR DIE VORLESEFUNKTION
   Mit bewussten Pausen
========================= */

const vorleseDeutsch =
    "Ich stand abends gegen 23 Uhr alleine vorm Cinemaxx. " +
    "Als ein schwarzes Auto vor mir gehalten hat, sagte er: " +
    "Hey, kennst du die Icki Micki Straße? " +
    "Ich hab den Namen nicht ganz verstanden, wollte ihm helfen " +
    "und bin einen Schritt näher ans Auto gegangen. " +
    "Ich frage: Welche Straße? " +
    "Und er sagt: " +
    "Ja, komm mit. " +
    "Die ist direkt neben der Ficki Ficki Straße.";


const vorleseEnglisch =
    "One evening, around 11 p.m., I was standing alone in front of the Cinemaxx. " +
    "A black car stopped in front of me, and the driver said: " +
    "Hey, do you know Icki Micki Street? " +
    "I didn't quite understand the name. " +
    "I wanted to help him, so I took one step closer to the car. " +
    "I asked: Which street? " +
    "And he said: " +
    "Yeah, come with me. " +
    "It's right next to Ficki Ficki Street.";


/* =========================
   STATUS
========================= */

let englischAktiv = false;


/* =========================
   SPRUCH ANZEIGEN
========================= */

function zeigeSpruch() {

    const spruchElement = document.getElementById("spruch");

    spruchElement.style.opacity = "0";

    setTimeout(() => {

        if (englischAktiv) {

            spruchElement.textContent = spruchEnglisch;

        } else {

            spruchElement.textContent = spruchDeutsch;

        }

        spruchElement.style.opacity = "1";

    }, 300);

}


/* =========================
   SPRACHE WECHSELN
========================= */

document.getElementById("languageButton").addEventListener("click", () => {

    englischAktiv = !englischAktiv;

    /* Laufende Sprachausgabe stoppen */

    if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

    }

    const button = document.getElementById("languageButton");

    if (englischAktiv) {

        button.textContent = "Deutsch";

    } else {

        button.textContent = "English";

    }

    zeigeSpruch();

});


/* =========================
   PASSENDE STIMME SUCHEN
========================= */

function findeStimme(sprache) {

    const stimmen = window.speechSynthesis.getVoices();

    if (stimmen.length === 0) {

        return null;

    }


    /* Erst exakt passende Sprache */

    let stimme = stimmen.find(voice =>
        voice.lang.toLowerCase() === sprache.toLowerCase()
    );


    /* Danach passende Sprachfamilie */

    if (!stimme) {

        stimme = stimmen.find(voice =>
            voice.lang.toLowerCase().startsWith(
                sprache.substring(0, 2).toLowerCase()
            )
        );

    }


    return stimme || null;

}


/* =========================
   VORLESEN
========================= */

document.getElementById("speakButton").addEventListener("click", () => {

    if (!("speechSynthesis" in window)) {

        alert(
            "Die Vorlesefunktion wird von diesem Gerät leider nicht unterstützt."
        );

        return;

    }


    /* Bereits laufende Ausgabe stoppen */

    window.speechSynthesis.cancel();


    const text = englischAktiv
        ? vorleseEnglisch
        : vorleseDeutsch;


    const sprache = englischAktiv
        ? "en-US"
        : "de-DE";


    const utterance =
        new SpeechSynthesisUtterance(text);


    /* Sprache */

    utterance.lang = sprache;


    /* Passende Stimme */

    const stimme = findeStimme(sprache);

    if (stimme) {

        utterance.voice = stimme;

    }


    /* Natürlichere Sprechweise */

    utterance.rate = 0.85;

    utterance.pitch = 1.0;

    utterance.volume = 1.0;


    /* Vorlesen starten */

    window.speechSynthesis.speak(utterance);

});


/* =========================
   STIMMEN LADEN
   (besonders wichtig für Safari)
========================= */

if ("speechSynthesis" in window) {

    window.speechSynthesis.onvoiceschanged = () => {

        window.speechSynthesis.getVoices();

    };

}


</script>
</body>

</html>
