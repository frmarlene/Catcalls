<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Catcalls</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap" rel="stylesheet"> <style> * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 100%; height: 100%; overflow: hidden; background: #ECE8E1; font-family: "Atkinson Hyperlegible Next", sans-serif; } body { display: flex; justify-content: center; align-items: center; } main { width: 90%; max-width: 650px; text-align: center; } #spruch { font-size: clamp(1.8rem, 6vw, 3rem); line-height: 1.4; font-weight: 600; color: #6B2F39; transition: opacity 0.4s ease; } .links { margin-top: 45px; display: flex; justify-content: center; gap: 30px; } .links button { border: none; background: none; padding: 10px; font-family: inherit; font-size: 1rem; color: #444; cursor: pointer; } .links button:hover { color: #6B2F39; } .links button:focus-visible { outline: 2px solid #6B2F39; outline-offset: 4px; } </style> </head> <body> <main> <div id="spruch"> Vielleicht ist Schweigen die lauteste Antwort. </div> <div class="links"> <button id="languageButton"> English </button> <button id="speakButton"> Vorlesen </button> </div> </main> <script> /* ========================= SPRUCH ========================= */ const spruchDeutsch = "Vielleicht ist Schweigen die lauteste Antwort."; const spruchEnglisch = "Perhaps silence is the loudest answer."; let englischAktiv = false; /* ========================= SPRUCH ANZEIGEN ========================= */ function zeigeSpruch() { const spruchElement = document.getElementById("spruch"); spruchElement.style.opacity = "0"; setTimeout(() => { if (englischAktiv) { spruchElement.textContent = spruchEnglisch; } else { spruchElement.textContent = spruchDeutsch; } spruchElement.style.opacity = "1"; }, 300); } /* ========================= SPRACHE WECHSELN ========================= */ document.getElementById("languageButton").addEventListener("click", () => { englischAktiv = !englischAktiv; const button = document.getElementById("languageButton"); if (englischAktiv) { button.textContent = "Deutsch"; } else { button.textContent = "English"; } zeigeSpruch(); }); /* ========================= VORLESEN ========================= */ document.getElementById("speakButton").addEventListener("click", () => { if (!("speechSynthesis" in window)) { alert("Die Vorlesefunktion wird von diesem Gerät leider nicht unterstützt."); return; } window.speechSynthesis.cancel(); const text = englischAktiv ? spruchEnglisch : spruchDeutsch; const utterance = new SpeechSynthesisUtterance(text); if (englischAktiv) { utterance.lang = "en-US"; } else { utterance.lang = "de-DE"; } utterance.rate = 0.9; window.speechSynthesis.speak(utterance); }); </script>
